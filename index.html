<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>RipWallet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<base target="_blank">
</head>

<body>
    <!-- Background -->
    <div class="bg-overlay"></div>
    <div class="bg-grain"></div>
    <div class="snow-area">
        <span class="snow snow1"></span>
        <span class="snow snow2"></span>
        <span class="snow snow3"></span>
        <span class="snow snow4"></span>
        <span class="snow snow5"></span>
    </div>

    <!-- Topbar -->
    <header class="topbar">
        <div class="logo-area">
            <div class="logo-glow"></div>
            <h1 class="logo-text">RipWallet</h1>
        </div>
        <div class="topbar-actions">
            <button class="lang-btn" id="langBtn">العربية</button>
        </div>
    </header>

<!-- Credit Bar -->
<div class="credit-bar">
    <span>Made by <strong>(s526) Mr</strong></span>
    <span class="credit-divider">·</span>
    <span>Discord: <strong>mr_alsharif</strong></span>
</div>

    <!-- Main Views Container -->
    <main id="app">
        <!-- Homepage -->
        <section id="homepage" class="view active">
            <!-- Hero -->
            <section class="hero-section">
                <div class="hero-glow"></div>
                <h2 class="hero-title" id="heroTitle">Welcome to RipWallet</h2>
                <p class="hero-subtitle" id="heroSubtitle">Whiteout Survival Ultimate Hub</p>
            </section>

            <!-- Events -->
            <section class="events-section">
                <div class="section-header">
                    <h3 class="section-title">Event Timers</h3>
                </div>
                <!-- Featured Event (Desktop only) -->
                <div class="events-featured" id="eventsFeatured"></div>
                <!-- Carousel -->
                <div class="events-carousel-wrapper">
                    <button class="carousel-nav prev" id="carouselPrev" onclick="EventsManager.scrollCarousel(-1)">‹</button>
                    <div class="events-carousel-track" id="eventsCarouselTrack"></div>
                    <button class="carousel-nav next" id="carouselNext" onclick="EventsManager.scrollCarousel(1)">›</button>
                </div>
                <div class="carousel-dots" id="carouselDots"></div>
            </section>

            <!-- Tools -->
            <section class="tools-section">
                <div class="section-header">
                    <h3 class="section-title">Calculators</h3>
                </div>
                <div class="tools-grid" id="toolsGrid"></div>
            </section>
        </section>

        <!-- Training View -->
        <section id="trainingView" class="view"></section>

        <!-- Gear Upgrade View -->
        <section id="gear_upgradeView" class="view"></section>

        <!-- Charms View -->
        <section id="charmsView" class="view"></section>
    </main>

<!-- Core -->
    <script src="core/router.js"></script>
    <script src="core/state.js"></script>
    <script src="core/storage.js"></script>
    <script src="core/i18n.js"></script>

    <!-- Data -->
    <script src="data/adminData.js"></script>
    <script src="data/charmsData.js"></script>
    <script src="data/eventsData.js"></script>
    <script src="data/gearData.js"></script>
    <script src="data/trainingData.js"></script>

    <!-- Logic -->
    <script src="logic/admin.js"></script>
    <script src="logic/charms.js"></script>
    <script src="logic/events.js"></script>
    <script src="logic/gear.js"></script>
    <script src="logic/training.js"></script>

    <!-- UI -->
    <script src="ui/animations.js"></script>
    <script src="ui/components.js"></script>
    <script src="ui/render.js"></script>

    <!-- Main -->
    <script src="script.js"></script>
</body>

</html>
